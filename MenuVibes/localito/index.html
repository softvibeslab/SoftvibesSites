<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localito MX - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--y:#FFD700;--b:#0D0D0D;--d:#1A1A1A;--g:#2a2a2a;--w:#FFF;--m:#aaa;--gr:#25D366;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--b);color:var(--w);font-family:'Nunito',sans-serif;padding-bottom:100px;overflow-x:hidden;}

  /* HERO */
  .hero{background:#fff;border-bottom:4px solid var(--y);padding:24px 20px 18px;text-align:center;}
  .hero img{height:54px;}
  .hero-tag{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#555;letter-spacing:3px;text-transform:uppercase;margin-top:8px;}

  /* SCHEDULE */
  .sched{background:var(--d);border-bottom:3px solid var(--y);padding:9px 16px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  .si{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--y);display:flex;align-items:center;gap:5px;}
  .si span{color:var(--w);font-weight:600;}

  /* CART BAR */
  .cart-bar{position:sticky;top:0;z-index:50;background:var(--d);border-bottom:2px solid #333;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
  .ci{font-size:13px;font-weight:700;color:var(--m);}
  .ci strong{color:var(--y);font-size:15px;}
  .cc{font-size:11px;font-weight:700;color:#666;background:none;border:1px solid #444;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:'Nunito',sans-serif;}

  /* SECTION BLOCK */
  .sec-block{max-width:480px;margin:0 auto;}

  /* COLLAPSIBLE SECTION HEADER */
  .sec-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 14px;cursor:pointer;user-select:none;border-bottom:1px solid #222;}
  .sec-header-left{display:flex;flex-direction:column;gap:2px;}
  .sec-header-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;color:var(--y);line-height:1;}
  .sec-header-sub{font-size:11px;color:var(--m);font-weight:600;}
  .sec-header-right{display:flex;align-items:center;gap:8px;}
  .sec-badge{background:var(--y);color:var(--b);font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
  .sec-arrow{font-size:18px;color:var(--y);transition:transform .3s;display:inline-block;}
  .sec-block.open .sec-arrow{transform:rotate(180deg);}

  /* LOCKED SECTION (fuera de horario) */
  .sec-header.locked .sec-header-title{color:#555;}
  .sec-header.locked .sec-badge{background:#333;color:#666;}
  .sec-header.locked .sec-arrow{color:#555;}
  .sec-lock-msg{font-size:11px;color:#c00;font-weight:700;margin-top:2px;}

  /* COLLAPSIBLE CONTENT */
  .sec-content{overflow:hidden;max-height:0;transition:max-height .35s ease;}
  .sec-block.open .sec-content{max-height:9999px;}

  /* INNER SECTION (subsection inside a block) */
  .inner-sec{padding:16px 16px 4px;}
  .inner-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--y);margin-bottom:10px;}
  .inner-badge{display:inline-block;background:var(--y);color:var(--b);font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;letter-spacing:1px;margin-bottom:10px;}
  .inner-nota{font-size:12px;color:var(--m);margin-bottom:12px;}
  .div{height:1px;background:linear-gradient(to right,transparent,#333,transparent);margin:4px 16px 14px;}

  /* MENU ITEM */
  .mi{background:var(--d);border-radius:12px;margin-bottom:8px;border:2px solid transparent;transition:border-color .15s,background .15s;overflow:hidden;}
  .mi.sel{border-color:var(--y);background:#1f1c00;}
  .mim{padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;user-select:none;}
  .ml{flex:1;}
  .mn{font-weight:900;font-size:15px;color:var(--w);line-height:1.2;}
  .md{font-size:12px;color:var(--m);margin-top:4px;line-height:1.5;}
  .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;}
  .tag{background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);color:var(--y);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .mr{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
  .mp{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--y);white-space:nowrap;}
  .chk{width:26px;height:26px;border-radius:50%;border:2px solid #444;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
  .mi.sel .chk{background:var(--y);border-color:var(--y);}
  .chk svg{width:14px;height:14px;opacity:0;transition:opacity .15s;}
  .mi.sel .chk svg{opacity:1;}

  /* ITEM PHOTO */
  .mi-photo{width:100%;height:160px;object-fit:cover;display:block;border-bottom:2px solid var(--b);}

  /* PAPAS OPTIONS */
  .pw{display:none;padding:0 14px 12px;}
  .mi.sel .pw{display:block;}
  .pl{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--y);opacity:.7;margin-bottom:7px;}
  .po{display:flex;gap:7px;}
  .pb{flex:1;padding:8px 10px;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer;border:2px solid #444;background:var(--g);color:var(--m);transition:all .15s;text-align:center;}
  .pb.on{background:var(--y);border-color:var(--y);color:var(--b);}

  /* QUANTITY SELECTOR */
  .iq{display:none;padding:0 14px 12px;align-items:center;gap:12px;}
  .mi.sel .iq{display:flex;}
  .iq-lbl{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--y);opacity:.7;}
  .iqc{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .iqb{width:28px;height:28px;border-radius:50%;background:var(--y);color:var(--b);font-size:18px;font-weight:900;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;}
  .iqb:active{transform:scale(.9);}
  .iqn{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--w);min-width:22px;text-align:center;}

  /* OPCIONES MULTI-SELECT */
  .ow{display:none;padding:0 14px 12px;}
  .mi.sel .ow{display:block;}
  .ol{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--y);opacity:.7;margin-bottom:7px;}
  .oo{display:flex;gap:7px;flex-wrap:wrap;}
  .ob{padding:8px 10px;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer;border:2px solid #444;background:var(--g);color:var(--m);transition:all .15s;text-align:center;}
  .ob.on{background:var(--y);border-color:var(--y);color:var(--b);}

  /* AGREGAR OTRO */
  .add-another{width:100%;padding:9px;background:none;border:2px dashed #444;border-radius:10px;color:#666;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer;transition:all .15s;margin-bottom:8px;display:none;}
  .mi.sel + .add-another{display:block;}
  .mi-dup + .add-another{display:block;}
  .add-another:hover{border-color:var(--y);color:var(--y);}
  .mi-dup{background:#141400;border-radius:12px;margin-bottom:4px;border:2px solid #555;overflow:hidden;}
  .mi-dup.sel-dup{border-color:var(--y);}
  .dup-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 15px;background:#1a1a00;border-bottom:1px solid #333;}
  .dup-lbl{font-size:11px;font-weight:800;color:var(--y);opacity:.7;letter-spacing:1px;text-transform:uppercase;}
  .dup-rm{font-size:13px;color:#666;background:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;padding:2px 8px;}

  /* PROMO SELECCIONABLE */
  .promo-sel{cursor:pointer;}
  .promo-sel.on{border-color:var(--y) !important;background:#1a1500 !important;}
  .promo-chk{width:24px;height:24px;border-radius:50%;border:2px solid #666;display:flex;align-items:center;justify-content:center;margin-left:auto;margin-top:6px;transition:all .15s;flex-shrink:0;}
  .promo-sel.on .promo-chk{background:var(--y);border-color:var(--y);}
  .promo-chk svg{width:13px;height:13px;opacity:0;}
  .promo-sel.on .promo-chk svg{opacity:1;}

  /* PROMO */
  .promo{background:var(--g);border:2px dashed var(--y);border-radius:12px;padding:13px 15px;margin:0 16px 16px;text-align:center;}
  .promo p{font-weight:700;font-size:14px;color:var(--y);}
  .promo span{display:block;font-size:12px;color:var(--m);margin-top:3px;}

  /* LOADING / ERROR */
  .loading{padding:40px 20px;text-align:center;color:var(--m);font-size:14px;}

  /* WHATSAPP BUTTON */
  .was{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;width:calc(100% - 32px);max-width:448px;}
  .wab{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--gr);color:white;padding:15px 20px;border-radius:50px;font-weight:900;font-size:15px;box-shadow:0 8px 32px rgba(37,211,102,.4);cursor:pointer;border:none;width:100%;font-family:'Nunito',sans-serif;transition:transform .15s,opacity .15s;}
  .wab:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .wab:not(:disabled):active{transform:scale(.97);}
  .wab svg{width:24px;height:24px;flex-shrink:0;}
  .wt{display:flex;flex-direction:column;align-items:flex-start;}
  .wt small{font-size:11px;font-weight:600;opacity:.9;}

  /* FOOTER */
  .footer{background:var(--y);padding:22px 20px 28px;text-align:center;margin-top:14px;}
  .footer h3{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--b);letter-spacing:2px;}
  .footer p{font-size:12px;font-weight:700;color:var(--b);opacity:.7;margin-top:2px;}
  .footer .handle{display:inline-block;margin-top:9px;background:var(--b);color:var(--y);font-weight:900;font-size:13px;padding:5px 14px;border-radius:20px;}
</style>
</head>

<script>
// ── INIT HERO & FOOTER ────────────────────────────────────────────────────────
document.getElementById('logo-img').src = CONFIG.logo;
document.getElementById('hero-tag').textContent = CONFIG.tagline;
document.getElementById('footer-root').innerHTML =
  '<h3>' + CONFIG.direccion + '</h3>' +
  '<p>' + CONFIG.ciudad + '</p>' +
  '<p style="margin-top:4px;">' + CONFIG.horario_footer + '</p>' +
  '<a class="handle" href="'+(CONFIG.instagram_url||'#')+'" target="_blank" style="text-decoration:none;">' + CONFIG.instagram + '</a>';

// ── CSV PARSER ────────────────────────────────────────────────────────────────
// Handles quoted fields with commas inside.
// Skips decorative title rows (row 1 in our Excel has a merged title cell).
// The real header row is detected by looking for known column names.
function parseCSV(text) {
  var lines = text.trim().split('\n');

  // Find the real header row — it must contain at least 3 comma-separated values
  var headerIdx = 0;
  for (var h = 0; h < Math.min(5, lines.length); h++) {
    var cols = lines[h].split(',');
    if (cols.length >= 3) { headerIdx = h; break; }
  }

  var headers = lines[headerIdx].split(',').map(function(h){ return h.trim().replace(/\r/g,'').replace(/"/g,''); });
  var rows = [];
  for (var i = headerIdx + 1; i < lines.length; i++) {
    var line = lines[i].replace(/\r/g,'');
    var cols = [], cur = '', inQ = false;
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    var row = {};
    headers.forEach(function(h, idx){ row[h] = (cols[idx] || '').replace(/"/g,'').trim(); });
    rows.push(row);
  }
  return rows;
}

// ── TIME HELPERS ──────────────────────────────────────────────────────────────
// Returns current time as minutes from midnight (e.g. 13:30 = 810)
function nowMinutes() {
  var d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

// Parses "HH:MM" string to minutes from midnight
function toMinutes(str) {
  if (!str) return -1;
  var parts = str.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1] || 0);
}

// Returns true if current time is within [inicio, fin]
function isAvailable(inicio, fin) {
  var now = nowMinutes();
  return now >= toMinutes(inicio) && now <= toMinutes(fin);
}

// Formats a time like "12:00" to display
function fmtTime(t) { return t; }

// ── BUILD MENU ITEM HTML ──────────────────────────────────────────────────────
function buildItem(row, features) {
  var hasPapas = row.has_papas === 'si';
  var attrs = hasPapas
    ? 'data-hp="1" data-bn="' + row.nombre + '" data-bp="' + row.precio + '" data-pp="' + row.precio_papas + '"'
    : '';

  var html = '<div class="mi" ' + attrs + ' onclick="toggleItem(this)">';

  // Photo — only if feature enabled and URL exists
  if (features.mostrar_fotos && row.imagen) {
    html += '<img class="mi-photo" src="' + row.imagen + '" alt="' + row.nombre + '" onerror="this.style.display=\'none\'">';
  }

  html += '<div class="mim"><div class="ml">';
  html += '<div class="mn">' + row.nombre + '</div>';
  if (row.descripcion) html += '<div class="md">' + row.descripcion + '</div>';
  if (row.tag) html += '<div class="mt"><span class="tag">' + row.tag + '</span></div>';
  html += '</div>';
  html += '<div class="mr"><div class="mp">$' + row.precio + '</div>';
  html += '<div class="chk"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  html += '</div></div>';

  if (hasPapas) {
    html += '<div class="pw"><div class="pl">Con papas?</div><div class="po">';
    html += '<button class="pb on" onclick="setPapas(event,this,false)">Sin papas $' + row.precio + '</button>';
    html += '<button class="pb" onclick="setPapas(event,this,true)">Con papas $' + row.precio_papas + '</button>';
    html += '</div></div>';
  }

  // Opciones multi-select (topping, complementos, etc.)
  var opRaw = (row.opciones||'').replace(/"/g,'').trim();
  if (opRaw) {
    var sep = opRaw.indexOf('|')>=0 ? '|' : ',';
    var opts = opRaw.split(sep).map(function(o){return o.trim();});
    var prRaw = (row.opciones_precio||'').replace(/"/g,'').trim();
    var prs = prRaw ? prRaw.split(sep).map(function(p){return parseInt(p)||0;}) : [];
    var lbl = (row.opciones_label||'Elige una opcion').replace(/"/g,'').trim();
    html += '<div class="ow"><div class="ol">'+lbl+'</div><div class="oo">';
    opts.forEach(function(o,i){
      var p = prs[i]!==undefined?prs[i]:(prs[0]||0);
      html += '<button class="ob" onclick="setOp(event,this,'+p+')">'+(p>0?o+' +$'+p:o)+'</button>';
    });
    html += '</div></div>';
  }

  html += '<div class="iq" onclick="event.stopPropagation()"><span class="iq-lbl">Cantidad</span>';
  html += '<div class="iqc"><button class="iqb" onclick="itemQty(event,this,-1)">-</button>';
  html += '<span class="iqn">1</span>';
  html += '<button class="iqb" onclick="itemQty(event,this,1)">+</button></div></div>';
  html += '</div>';

  // Boton agregar otro — se oculta si has_agregar === 'no' en el Sheets
  var haAddAnother = (row.has_agregar || 'si') !== 'no';
  if (haAddAnother) {
  html += '<button class="add-another"'
    +' data-nombre="'+row.nombre+'"'
    +' data-precio="'+(row.precio||0)+'"'
    +' data-pp="'+(row.precio_papas||'')+'"'
    +' data-bp="'+(row.precio||0)+'"'
    +' data-hp="'+(row.has_papas==='si'?'1':'')+'"'
    +' data-op="'+opRaw+'"'
    +' data-opp="'+((row.opciones_precio||'').replace(/"/g,'').trim())+'"'
    +' data-opl="'+((row.opciones_label||'').replace(/"/g,'').trim())+'"'
    +' onclick="addAnother(this)">+ Agregar otro '+row.nombre+'</button>';
  }

  return html;
}

// ── GROUP SECCIONES INTO MAIN BLOCKS ─────────────────────────────────────────
// Secciones that share the same horario_inicio are grouped into one collapsible block
// The first seccion of each group becomes the block's header
function groupSecciones(secciones) {
  var blocks = [], currentBlock = null;
  secciones.forEach(function(sec) {
    // A section is a "main block" if it's not a subsection (sm !== 'si')
    if (sec.sm !== 'si') {
      if (currentBlock) blocks.push(currentBlock);
      currentBlock = { header: sec, children: [] };
    } else {
      if (currentBlock) currentBlock.children.push(sec);
    }
  });
  if (currentBlock) blocks.push(currentBlock);
  return blocks;
}

// ── BUILD FULL MENU ───────────────────────────────────────────────────────────
function buildMenu(menuRows, secRows, features) {
  // Filter active secciones
  var secciones = secRows.filter(function(s){ return s.activo === 'si'; });

  // Group items by seccion key, filtering inactive
  var groups = {};
  menuRows.forEach(function(row) {
    if (row.activo !== 'si') return;
    if (!groups[row.seccion]) groups[row.seccion] = [];
    groups[row.seccion].push(row);
  });

  // Build schedule bar from unique horarios
  var seen = {}, schedHTML = '';
  secciones.forEach(function(s) {
    var key = s.horario_inicio + '-' + s.horario_fin;
    if (!seen[key] && s.horario_inicio && !s.sm) {
      seen[key] = true;
      schedHTML += '<div class="si">' + s.titulo + ' <span>' + s.horario_inicio + '-' + s.horario_fin + '</span></div>';
    }
  });
  document.getElementById('sched-bar').innerHTML = schedHTML;

  // Group into collapsible blocks
  var blocks = groupSecciones(secciones);
  var html = '';

  blocks.forEach(function(block) {
    var sec = block.header;
    var available = !features.verificar_horario || isAvailable(sec.horario_inicio, sec.horario_fin);
    var collapsed = features.colapsar_secciones && (sec.collapsed === 'si' || !available);
    var isOpen = !features.colapsar_secciones || (!collapsed && available);

    // Determine block subtitle (time range)
    var subLabel = sec.horario_inicio && sec.horario_fin
      ? sec.horario_inicio + ' - ' + sec.horario_fin + ' h'
      : '';

    html += '<div class="sec-block' + (isOpen ? ' open' : '') + '">';

    // Block header (collapsible trigger)
    var headerClass = 'sec-header' + (!available && features.verificar_horario ? ' locked' : '');
    var clickAction = features.colapsar_secciones ? 'onclick="toggleBlock(this)"' : '';
    html += '<div class="' + headerClass + '" ' + clickAction + '>';
    html += '<div class="sec-header-left">';
    html += '<span class="sec-header-title">' + sec.titulo + '</span>';
    if (subLabel) html += '<span class="sec-header-sub">' + subLabel + '</span>';
    if (!available && features.verificar_horario) {
      html += '<span class="sec-lock-msg">Disponible a las ' + fmtTime(sec.horario_inicio) + '</span>';
    }
    html += '</div>';
    html += '<div class="sec-header-right">';
    if (sec.badge) html += '<span class="sec-badge">' + sec.badge + '</span>';
    if (features.colapsar_secciones) html += '<span class="sec-arrow">▾</span>';
    html += '</div></div>';

    // Collapsible content
    html += '<div class="sec-content">';

    // Main section items
    if (groups[sec.key] && groups[sec.key].length > 0) {
      if (sec.nota) html += '<div class="inner-sec"><div class="inner-nota">' + sec.nota + '</div>';
      else html += '<div class="inner-sec">';
      groups[sec.key].forEach(function(row){ html += buildItem(row, features); });
      html += '</div>';
    }

    // Promo box after desayuno — seleccionable si tiene nombre y precio
    if (sec.key === 'desayuno') {
      var pn = CONFIG.promo_nombre||'';
      var pp = parseInt(CONFIG.promo_precio||0);
      if (pn) {
        html += '<div class="promo promo-sel" onclick="togglePromo(this)" data-nombre="'+pn+'" data-precio="'+pp+'">';
        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">';
        html += '<div><p>Promocion del dia</p><span>'+CONFIG.promo_texto+'</span>';
        if (pp>0) html += '<span style="display:block;margin-top:6px;font-family:Bebas Neue,sans-serif;font-size:22px;color:var(--y);">$'+pp+'</span>';
        html += '</div>';
        html += '<div class="promo-chk"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
        html += '</div></div>';
      } else {
        html += '<div class="promo"><p>Promocion del dia</p><span>'+CONFIG.promo_texto+'</span></div>';
      }
    }

    // Children subsections
    block.children.forEach(function(child) {
      var childItems = groups[child.key];
      if (!childItems || childItems.length === 0) return;
      html += '<div class="div"></div>';
      html += '<div class="inner-sec">';
      html += '<div class="inner-title">' + child.titulo + '</div>';
      if (child.badge) html += '<div class="inner-badge">' + child.badge + '</div>';
      if (child.nota) html += '<div class="inner-nota">' + child.nota + '</div>';
      childItems.forEach(function(row){ html += buildItem(row, features); });
      html += '</div>';
    });

    html += '</div>'; // sec-content
    html += '</div>'; // sec-block
  });

  return html;
}

// ── TOGGLE COLLAPSIBLE BLOCK ──────────────────────────────────────────────────
function toggleBlock(headerEl) {
  var block = headerEl.closest('.sec-block');
  // If section is locked (fuera de horario), don't open
  if (headerEl.classList.contains('locked')) return;
  block.classList.toggle('open');
}

// ── LOAD ALL DATA ─────────────────────────────────────────────────────────────
function loadMenu() {
  Promise.all([
    fetch(CONFIG.csv_menu).then(function(r){ return r.text(); }),
    fetch(CONFIG.csv_secciones).then(function(r){ return r.text(); }),
    fetch(CONFIG.csv_config).then(function(r){ return r.text(); })
  ])
  .then(function(results) {
    var menuRows = parseCSV(results[0]);
    var secRows  = parseCSV(results[1]);
    var cfgRows  = parseCSV(results[2]);



    // Features y branding desde config sheet
    var features = { colapsar_secciones:false, verificar_horario:false, mostrar_fotos:false };
    var BRANDING_KEYS = ['logo','tagline','whatsapp','direccion','ciudad','horario_footer','instagram','instagram_url','promo_texto','promo_nombre','promo_precio'];
    cfgRows.forEach(function(r) {
      if (!r.funcion) return;
      if (r.activo === 'si') features[r.funcion] = true;
      if (BRANDING_KEYS.indexOf(r.funcion) >= 0 && r.activo && r.activo !== 'si' && r.activo !== 'no') {
        CONFIG[r.funcion] = r.activo;
      }
    });
    // Aplicar branding al DOM — solo actualizar si tiene valor real
    if (CONFIG.logo && CONFIG.logo.indexOf('placeholder') < 0) {
      document.getElementById('logo-img').src = CONFIG.logo;
    }
    document.getElementById('hero-tag').textContent = CONFIG.tagline;
    document.getElementById('footer-root').innerHTML =
      '<h3>'+CONFIG.direccion+'</h3>'+
      '<p>'+CONFIG.ciudad+'</p>'+
      '<p style="margin-top:4px;">'+CONFIG.horario_footer+'</p>'+
      '<a class="handle" href="'+(CONFIG.instagram_url||'#')+'" target="_blank" style="text-decoration:none;">'+CONFIG.instagram+'</a>';

    document.getElementById('menu-root').innerHTML = buildMenu(menuRows, secRows, features);

  })
  .catch(function(err) {
    document.getElementById('menu-root').innerHTML =
      '<div class="loading" style="color:#ff6b6b;">' +
      'Error al cargar el menu.<br><br>' +
      '<small style="color:#aaa;font-size:11px;word-break:break-all;">' + err.toString() + '</small><br><br>' +
      '<button onclick="loadMenu()" style="background:var(--y);color:var(--b);border:none;padding:10px 20px;border-radius:20px;font-weight:900;font-size:14px;cursor:pointer;font-family:Nunito,sans-serif;">Reintentar</button>' +
      '</div>';
    console.error('Menu load error:', err);
  });
}

// ── INTERACTION ───────────────────────────────────────────────────────────────
function toggleItem(el) {
  el.classList.toggle('sel');
  if (!el.classList.contains('sel')) {
    var qn = el.querySelector('.iqn');
    if (qn) qn.textContent = '1';
  }
  updateCart();
}

function itemQty(e, btn, d) {
  e.stopPropagation();
  var qn = btn.closest('.iqc').querySelector('.iqn');
  qn.textContent = String(Math.max(1, (parseInt(qn.textContent) || 1) + d));
  updateCart();
}

function setPapas(e, btn, withPapas) {
  e.stopPropagation();
  btn.closest('.po').querySelectorAll('.pb').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  updateCart();
}

// Multi-select opciones
function setOp(e, btn, price) {
  e.stopPropagation();
  if (btn.classList.contains('on')) {
    btn.classList.remove('on'); btn.dataset.extra = '0';
  } else {
    btn.classList.add('on'); btn.dataset.extra = String(price);
  }
  updateCart();
}

// Toggle promo seleccionable
function togglePromo(el) {
  el.classList.toggle('on');
  updateCart();
}

// Agregar otra copia del mismo item
function addAnother(btn) {
  var nombre = btn.dataset.nombre || '';
  var bp = btn.dataset.bp || '0';
  var pp = btn.dataset.pp || '';
  var hp = btn.dataset.hp || '';
  var opRaw = btn.dataset.op || '';
  var prRaw = btn.dataset.opp || '';
  var lbl = btn.dataset.opl || 'Elige una opcion';

  var precio = btn.dataset.precio || btn.dataset.bp || '0';
  var d = '<div class="mi-dup" data-precio="'+precio+'">';
  d += '<div class="dup-hdr"><span class="dup-lbl">+ '+nombre+' adicional</span>';
  d += '<button class="dup-rm" onclick="this.closest(\'.mi-dup\').remove();updateCart()">✕</button></div>';
  // Papas
  if (hp) {
    d += '<div class="pw" style="display:block"><div class="pl">Con papas?</div><div class="po">';
    d += '<button class="pb on" onclick="setPapas(event,this,false)">Sin papas $'+bp+'</button>';
    d += '<button class="pb" onclick="setPapas(event,this,true)">Con papas $'+pp+'</button>';
    d += '</div></div>';
  }
  // Opciones
  if (opRaw) {
    var sep = opRaw.indexOf('|')>=0?'|':',';
    var opts = opRaw.split(sep);
    var prs = prRaw ? prRaw.split(sep).map(function(p){return parseInt(p)||0;}) : [];
    d += '<div class="ow" style="display:block"><div class="ol">'+lbl+'</div><div class="oo">';
    opts.forEach(function(o,i){
      var p = prs[i]!==undefined?prs[i]:(prs[0]||0);
      d += '<button class="ob" onclick="setOp(event,this,'+p+')">'+(p>0?o.trim()+' +$'+p:o.trim())+'</button>';
    });
    d += '</div></div>';
  }
  d += '<div class="iq" style="display:flex" onclick="event.stopPropagation()"><span class="iq-lbl">Cantidad</span>';
  d += '<div class="iqc"><button class="iqb" onclick="itemQty(event,this,-1)">-</button>';
  d += '<span class="iqn">1</span>';
  d += '<button class="iqb" onclick="itemQty(event,this,1)">+</button></div></div>';
  d += '</div>';

  btn.insertAdjacentHTML('beforebegin', d);
  updateCart();
}

function clearAll() {
  document.querySelectorAll('.mi.sel').forEach(function(el) {
    el.classList.remove('sel');
    var qn = el.querySelector('.iqn');
    if (qn) qn.textContent = '1';
    el.querySelectorAll('.ob.on').forEach(function(b){ b.classList.remove('on'); b.dataset.extra='0'; });
  });
  document.querySelectorAll('.mi-dup').forEach(function(el){ el.remove(); });
  var promoEl = document.querySelector('.promo-sel.on');
  if (promoEl) promoEl.classList.remove('on');
  updateCart();
}

function getSelected() {
  var result = [];
  document.querySelectorAll('.mi.sel').forEach(function(el) {
    var qn = el.querySelector('.iqn');
    var qty = qn ? (parseInt(qn.textContent) || 1) : 1;
    var name, price;
    if (el.dataset.hp) {
      var on = el.querySelector('.pb.on');
      var con = on && on.textContent.indexOf('Con papas') >= 0;
      name = el.dataset.bn + (con ? ' con papas' : ' sin papas');
      price = parseInt(con ? el.dataset.pp : el.dataset.bp);
    } else {
      name = el.querySelector('.mn').textContent.trim();
      price = parseInt(el.querySelector('.mp').textContent.replace('$',''));
    }
    // Multi-select opciones
    el.querySelectorAll('.ob.on').forEach(function(b){
      price += parseInt(b.dataset.extra||'0');
      name += ' + ' + b.textContent.replace(/\s*\+\$\d+/,'').trim();
    });
    if (qty > 1) name += ' x'+qty;
    result.push({ name:name, price:price*qty });
  });

  // Duplicados
  document.querySelectorAll('.mi-dup').forEach(function(el) {
    var lbl = el.querySelector('.dup-lbl');
    var name = lbl ? lbl.textContent.replace('+ ','').replace(' adicional','') : 'Item';
    var qn = el.querySelector('.iqn');
    var qty = qn ? (parseInt(qn.textContent)||1) : 1;
    // Precio base desde data-precio del div (guardado al crear el dup)
    var price = parseInt(el.dataset.precio || '0');
    // Si tiene opcion de papas, usar precio del boton seleccionado
    var onPb = el.querySelector('.pb.on');
    if (onPb) {
      var m = onPb.textContent.match(/\$(\d+)/);
      if (m) price = parseInt(m[1]);
      name += onPb.textContent.indexOf('Con papas')>=0 ? ' con papas' : ' sin papas';
    }
    // Sumar opciones seleccionadas
    el.querySelectorAll('.ob.on').forEach(function(b){
      price += parseInt(b.dataset.extra||'0');
      name += ' + ' + b.textContent.replace(/\s*\+\$\d+/,'').trim();
    });
    if (qty>1) name += ' x'+qty;
    result.push({name:name, price:price*qty});
  });

  // Promo
  var promoEl = document.querySelector('.promo-sel.on');
  if (promoEl) {
    result.push({name: promoEl.dataset.nombre||'Promocion del dia', price: parseInt(promoEl.dataset.precio||0)});
  }

  return result;
}

function updateCart() {
  var items = getSelected();
  var total = items.reduce(function(s,i){ return s+i.price; }, 0);
  var n = items.length;
  document.getElementById('cnt').textContent = n === 0 ? '0 items' : n + ' item' + (n>1?'s':'') + ' $' + total;
  var btn = document.getElementById('wa-btn');
  btn.disabled = n === 0;
  document.getElementById('wa-lbl').textContent = n === 0 ? 'Selecciona un platillo' : 'Enviar pedido (' + n + ' item' + (n>1?'s':'') + ')';
  document.getElementById('wa-tot').textContent = n > 0 ? 'Total estimado: $' + total : '';
}

function sendOrder() {
  var items = getSelected();
  if (!items.length) return;
  var total = items.reduce(function(s,i){ return s+i.price; }, 0);
  var list = items.map(function(i,n){ return (n+1)+'. '+i.name+' - $'+i.price; }).join('\n');
  var msg = 'Hola! Quiero hacer el siguiente pedido:\n\n' + list + '\n\nTotal estimado: $' + total + '\n\nMe pueden confirmar disponibilidad? Gracias!';
  window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg), '_blank');
}

document.addEventListener('DOMContentLoaded', loadMenu);
</script>

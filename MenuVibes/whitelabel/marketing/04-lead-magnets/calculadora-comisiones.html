<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de comisiones - MenuVibes</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f4f4f2}
    body{margin:0;padding:24px}
    main{max-width:760px;margin:0 auto;background:white;border:1px solid #ddd;border-radius:8px;padding:24px}
    h1{font-size:32px;line-height:1.05;margin:0 0 10px}
    p{color:#555}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0}
    label{display:grid;gap:6px;font-weight:800;color:#333}
    input{border:1px solid #ccc;border-radius:8px;padding:12px;font-size:18px}
    .result{background:#101010;color:white;border-radius:8px;padding:18px;margin-top:16px}
    .result strong{display:block;color:#ffd23f;font-size:34px;margin-top:4px}
    .cta{display:inline-block;background:#16a34a;color:white;text-decoration:none;font-weight:900;border-radius:8px;padding:13px 18px;margin-top:18px}
    @media(max-width:620px){.grid{grid-template-columns:1fr}body{padding:12px}main{padding:18px}}
  </style>
</head>
<body>
  <main>
    <h1>Cuanto te cuestan las comisiones?</h1>
    <p>Calcula cuanto pagas a apps y cuanto podrias recuperar llevando clientes directos a WhatsApp con MenuVibes.</p>
    <form class="grid" oninput="calc()">
      <label>Pedidos mensuales por apps <input id="orders" type="number" value="120"></label>
      <label>Ticket promedio <input id="ticket" type="number" value="220"></label>
      <label>Comision promedio % <input id="fee" type="number" value="25"></label>
      <label>% recuperable a WhatsApp <input id="recover" type="number" value="20"></label>
    </form>
    <div class="result">
      <span>Comision mensual estimada</span>
      <strong id="commission">$6,600</strong>
      <span>Ahorro potencial mensual</span>
      <strong id="saving">$1,320</strong>
    </div>
    <a class="cta" href="https://wa.me/529984000000?text=Hola%2C%20quiero%20calcular%20mi%20ahorro%20con%20MenuVibes" target="_blank" rel="noopener">Quiero mi demo</a>
  </main>
  <script>
    function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n||0)}
    function calc(){
      var orders=+document.getElementById('orders').value||0;
      var ticket=+document.getElementById('ticket').value||0;
      var fee=(+document.getElementById('fee').value||0)/100;
      var recover=(+document.getElementById('recover').value||0)/100;
      var commission=orders*ticket*fee;
      document.getElementById('commission').textContent=money(commission);
      document.getElementById('saving').textContent=money(commission*recover);
    }
    calc();
  </script>
</body>
</html>

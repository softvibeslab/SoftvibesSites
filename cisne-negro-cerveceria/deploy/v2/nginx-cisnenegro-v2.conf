# /etc/nginx/snippets/cisnenegro-v2.conf — incluido en el server 443 de cisnenegro.softvibes.art
# Entorno /v2 (Mi pedido, Wi-Fi y app instalable): backend separado en 127.0.0.1:8791.
location /v2/admin/ {
    auth_basic "Cisne Negro - Equipo";
    auth_basic_user_file /etc/nginx/.htpasswd-cisnenegro;
    try_files $uri $uri/ =404;
}
location /v2/api/admin/ {
    auth_basic "Cisne Negro - Equipo";
    auth_basic_user_file /etc/nginx/.htpasswd-cisnenegro;
    proxy_pass http://127.0.0.1:8791/api/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /v2/api/ {
    limit_except GET POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8791/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
# App del equipo: además de GET/POST usa PUT (editar meseros). Sesión propia (cookie cn_equipo, PIN).
location /v2/api/equipo/ {
    limit_except GET POST PUT { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8791/api/equipo/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /v2/equipo/equipo.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /v2/manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Villanueva | Enlaces</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .links-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }
        .link-btn {
            display: block;
            padding: 16px;
            margin: 15px 0;
            background: linear-gradient(135deg, #2d3436, #1a1a1a);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            transition: transform 0.3s;
        }
        .link-btn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <div class="logo">Mario Villanueva</div>
                <nav class="nav-desktop">
                    <a href="/">Inicio</a>
                    <a href="/analisis/">Análisis</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="links-container">
        <h1>Enlaces de Mario Villanueva</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Selecciona dónde quieres conectar</p>

        <a href="https://www.instagram.com/mariovillanueva.mx/" target="_blank" class="link-btn">
            📱 Instagram
        </a>

        <a href="https://www.linkedin.com/in/mariovillanueva/" target="_blank" class="link-btn">
            💼 LinkedIn
        </a>

        <a href="https://pay.hotmart.com/" target="_blank" class="link-btn">
            🎓 BEAT EXPRESS ($27)
        </a>

        <a href="/" class="link-btn" style="background: #ff6b6b;">
            🏠 Volver al Inicio
        </a>
    </section>

    <footer class="footer" style="margin-top: 60px;">
        <div class="container">
            <p>© 2026 Mario Villanueva. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>

# /etc/nginx/sites-available/closefactory.softvibes.art — THE CLOSE FACTORY (estático)
# Dominio definitivo desde 2026-10-29: la landing se indexa; /analisis/ no.
# Incluye los bloques de certbot: subir este archivo NO rompe el SSL.
server {
    server_name closefactory.softvibes.art;
    root /var/www/closefactory;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /analisis/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~* \.(jpg|jpeg|png|webp)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /analisis/\n\nSitemap: https://closefactory.softvibes.art/sitemap.xml\n";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/closefactory.softvibes.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/closefactory.softvibes.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = closefactory.softvibes.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name closefactory.softvibes.art;
    return 404; # managed by Certbot
}
